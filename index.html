<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3Dto2Dshape fork: local MMD models and motions, real-time 3D-to-2D rendering, Live2D baking and video export." />
    <title>3Dto2Dshape · 3D to 2D / Live2D</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // [three.js guard] three.js r171 calls .trim() on getProgramInfoLog()
      // which may return null when the WebGL context is stressed. Normalize it.
      (function () {
        for (const proto of [WebGLRenderingContext.prototype, WebGL2RenderingContext.prototype]) {
          for (const key of ['getProgramInfoLog', 'getShaderInfoLog']) {
            const orig = proto[key];
            if (!orig) continue;
            proto[key] = function () { return orig.apply(this, arguments) || ''; };
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
